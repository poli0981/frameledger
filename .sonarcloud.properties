# SonarCloud Automatic Analysis — read from the default branch (docs/13_CI_CD.md §SonarCloud, decision D67).
# Automatic Analysis reads only this file: sonar.issue.ignore.* is not supported here, so the rules accepted by design
# are recorded in docs/13_CI_CD.md and marked by the owner in SonarCloud's own UI.

# What is not FrameLedger's code, or not code at all:
# - src/native/third_party: the vendored SDK headers (NVAPI, Streamline, FidelityFX, Vulkan-Headers) — 51 headers,
#   66 thousand lines, consumed unmodified (each folder's README says so and license-check holds it).
# - Strings.Designer.cs: generated by tools/resx-gen.ps1.
# - dxr_raygen_dxil.h: a compiled shader as a byte array, generated.
# - vendor-stubs: test fixtures that carry the vendors' export names and signatures on purpose.
# - tests/fixtures: the detection corpus (empty marker binaries and expected JSON).
# - legal/licenses, docs/vendor-exports.json: licence texts and a generated export list.
# - Migrations: SQLite scripts, which a SQL analyser reads as another dialect.
sonar.exclusions=src/native/third_party/**,**/Strings.Designer.cs,src/native/tools/hook-harness/dxr_raygen_dxil.h,src/native/tools/vendor-stubs/**,tests/fixtures/**,legal/licenses/**,docs/vendor-exports.json,src/FrameLedger.Infrastructure/Persistence/Migrations/**

# Tests repeat their arrange steps on purpose; duplication there is not a defect.
sonar.cpd.exclusions=tests/**,src/native/tests/**

# The native code is C++20 (src/native/CMakeLists.txt); report against it, not a later standard.
sonar.cfamily.reportingCppStandardOverride=c++20

sonar.sourceEncoding=UTF-8
