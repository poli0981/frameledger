# Qodana (owner decision D93, 2026-11-10; docs/13_CI_CD.md §Qodana).
#
# JetBrains' template for the Qodana Scan action, changed where FrameLedger differs
# and each change said here:
#
# - The linter is Qodana Community for .NET (qodana.yaml names it and says why): a
#   Linux container, which is why this job alone runs on ubuntu-latest in a
#   Windows-only project. EnableWindowsTargeting lets the .NET SDK there build and
#   load projects whose target is Windows; it is passed to the container rather than
#   written into Directory.Build.props, because no build of the product is meant to
#   run anywhere but Windows.
# - The action is pinned to a commit (v2026.2.2, the newest; the template names
#   v2026.1), as every action that is not GitHub's own is here.
# - Permissions are the ones the job uses: it reads the repository, writes a check
#   run with the annotations and one comment on the pull request. The template's
#   `contents: write` is for pushing quick-fixes, which this job never does.
# - A workflow of its own, as JetBrains advises, and ADVISORY: `main`'s required
#   contexts stay `check` and the two `analyze` jobs. A problem Qodana finds, or a
#   Qodana Cloud outage, is a red job beside a green `check`, never a blocked merge.
# - `main` only: the `alpha` branch builds on a prerelease .NET the linter's image
#   does not carry (docs/13_CI_CD.md §The alpha line).

name: Qodana

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    # A pull request from this repository, or a push or a dispatch. QODANA_TOKEN
    # reaches neither a fork's pull request nor Dependabot's, and their token cannot
    # write the check run or the comment.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's own commit, not its merge commit (empty on a push or
          # a dispatch, which then check out the commit that started them).
          ref: ${{ github.event.pull_request.head.sha }}
          # A full history is required for pull request analysis.
          fetch-depth: 0

      # pr-mode false: the whole solution every time, so a pull request and `main`
      # are judged by the same list. upload-result: the SARIF and the linter's log
      # as an artifact of the run, for a reader with no Qodana Cloud account.
      # Caches are saved from `main` only (a pull request reads them): one per
      # branch would crowd the repository's cache quota, which NuGet's share.
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false
          upload-result: true
          cache-default-branch-only: true
          env-vars-to-linter: EnableWindowsTargeting
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          EnableWindowsTargeting: 'true'
