# Qodana (owner decisions D93, 2026-11-10, and D99, 2026-11-11; docs/13_CI_CD.md §Qodana).
#
# JetBrains' template for the Qodana Scan action, changed where FrameLedger differs
# and each change said here:
#
# - The linter is Qodana for .NET (Rider's engine) in NATIVE mode, on a Windows
#   runner: the projects target Windows, and the linter then builds and loads them
#   with the SDK this job installs from global.json - no container, and no
#   EnableWindowsTargeting. qodana.yaml names the linter and the mode; nothing is
#   passed as an action argument. (Until beta.37 this was the Community linter in a
#   Linux container, the one Linux job this repository had.)
# - The action is pinned to a commit, as every action that is not GitHub's own is
#   here.
# - Permissions are the ones the job uses: it reads the repository, writes a check
#   run with the annotations and one comment on the pull request. The template's
#   `contents: write` is for pushing quick-fixes, which this job never does.
# - A workflow of its own, as JetBrains advises, and ADVISORY: `main`'s required
#   contexts stay `check` and the two `analyze` jobs. A problem Qodana finds, a
#   Qodana Cloud outage or a lapsed licence is a red job beside a green `check`,
#   never a blocked merge.
# - Two jobs, two reports (D99): `managed` reads the solution - the C#, the XAML and
#   what Rider's plugins read around it - and reports to the Qodana Cloud project
#   `frameledger`; `native` reads the C++ of src/native through a Visual Studio
#   solution CMake generates for it, with settings of its own (qodana-native.yaml),
#   and reports to `frameledger-cpp`. Neither reads what the other does. The pull
#   request's comment and annotations are the managed job's alone.
# - `main` only: the `alpha` branch is main's source under another release line
#   (docs/13_CI_CD.md §The alpha line), and main's is what is analysed.

name: Qodana

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    name: Qodana (managed)
    # A pull request from this repository, or a push or a dispatch. QODANA_TOKEN
    # reaches neither a fork's pull request nor Dependabot's, and their token cannot
    # write the check run or the comment.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's own commit, not its merge commit (empty on a push or
          # a dispatch, which then check out the commit that started them).
          ref: ${{ github.event.pull_request.head.sha }}
          # A full history is required for pull request analysis.
          fetch-depth: 0

      # Native mode runs the linter in this job's environment, so the SDK it loads
      # the projects with is this one. No MSVC step here on purpose: it exports
      # Platform=x64, which MSBuild reads as a solution platform (build.ps1's
      # Clear-VcxprojPlatform).
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restored only: `check` saves this cache, under the same key.
      - name: Restore the NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Built before it is inspected: a build that fails is then one red step with
      # the compiler's own message, not a report of thousands of unresolved symbols.
      # The native DLLs are absent here, so the .targets that copy them warn and the
      # build goes on, as on a fresh clone.
      - name: Build what the linter loads
        shell: pwsh
        run: |
          dotnet build FrameLedger.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'the build failed' }

      # pr-mode false: the whole solution every time, so a pull request and `main`
      # are judged by the same list. upload-result: the SARIF and the linter's log
      # as an artifact of the run, for a reader with no Qodana Cloud account.
      # Caches are saved from `main` only (a pull request reads them), under keys of
      # this job's own: one per branch would crowd the repository's cache quota,
      # which NuGet's share.
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false
          upload-result: true
          artifact-name: qodana-report
          cache-default-branch-only: true
          primary-cache-key: qodana-managed-${{ github.ref_name }}-${{ github.sha }}
          additional-cache-key: qodana-managed-main
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

  native:
    name: Qodana (native)
    # The same condition as `managed`, for the same reason: QODANA_TOKEN_NATIVE
    # reaches neither a fork's pull request nor Dependabot's.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: windows-latest
    timeout-minutes: 60
    # No annotations and no comment from this job (below), so it writes nothing.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # global.json sits above the solution, and the linter resolves it.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The Visual Studio generator finds the toolset itself: no MSVC step. Configure
      # fetches MinHook, Catch2 and jsmn into the build tree, as the gate's does.
      - name: Generate the solution and the one generated header
        shell: pwsh
        working-directory: src/native
        run: |
          cmake --version
          cmake --preset x64-vs-analysis
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build --preset x64-vs-analysis --target fl_ac_floor_gen
          if ($LASTEXITCODE -ne 0) { throw 'generating the blocklist floor failed' }
          if (-not (Test-Path ../../build/native/x64-vs-analysis/FrameLedgerNative.slnx)) {
            Get-ChildItem ../../build/native/x64-vs-analysis -Filter 'FrameLedgerNative.*' | ForEach-Object { Write-Host $_.Name }
            throw 'CMake did not write FrameLedgerNative.slnx (qodana-native.yaml names it)'
          }

      # A report of its own: its own settings file, results folder, artifact, cache
      # keys and Qodana Cloud project. The pull request's comment and annotations are
      # the managed job's; a second job of the same linter would overwrite them.
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --config qodana-native.yaml
          results-dir: ${{ runner.temp }}/qodana-native/results
          cache-dir: ${{ runner.temp }}/qodana-native/caches
          pr-mode: false
          upload-result: true
          artifact-name: qodana-report-native
          cache-default-branch-only: true
          primary-cache-key: qodana-native-${{ github.ref_name }}-${{ github.sha }}
          additional-cache-key: qodana-native-main
          post-pr-comment: false
          use-annotations: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_NATIVE }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
